global:
  domain: argocd

configs:
  params:
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: tailscale
    annotations:
      tailscale.com/expose: "true"
    hosts:
      - argocd
    tls:
      - hosts:
          - argocd
        secretName: argocd-tls-cert
    backend:
      service:
        name: argocd
        port:
          name: http
