apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - ingress.yaml
  - pvc.yaml
  - service.yaml

patches:
  - target:
      kind: Ingress
      name: vaultwarden
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: vaultwarden
      spec:
        rules:
          - host: vault.chimera-fence.ts.net
        tls:
          - hosts:
              - vault.chimera-fence.ts.net

  - target:
      kind: Deployment
      name: vaultwarden
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vaultwarden
      spec:
        template:
          spec:
            containers:
              - name: vaultwarden
                env:
                  - name: DOMAIN
                    value: "https://vault.chimera-fence.ts.net"
