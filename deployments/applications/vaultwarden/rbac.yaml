apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vaultwarden-ingress-reader
  namespace: applications
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    resourceNames: ["vaultwarden"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vaultwarden-ingress-reader
  namespace: applications
subjects:
  - kind: ServiceAccount
    name: vaultwarden-sa
    namespace: applications
roleRef:
  kind: Role
  name: vaultwarden-ingress-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vaultwarden-token-reviewer
subjects:
  - kind: ServiceAccount
    name: vaultwarden-sa
    namespace: applications
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
