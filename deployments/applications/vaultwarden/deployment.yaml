apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: applications
  labels:
    app: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      serviceAccountName: vaultwarden-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: hostname-discovery
          image: curlimages/curl:latest
          command: ["/bin/sh", "/scripts/discover.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: discovery-script
              mountPath: /scripts
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.2-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              export DOMAIN="https://$(cat /shared/domain)"
              exec /start.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: SIGNUPS_ALLOWED
              value: "true"
            - name: DATA_FOLDER
              value: "/data"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secrets
                  key: VAULT_ADMIN_TOKEN
          ports:
            - name: http
              containerPort: 80
            - name: websocket
              containerPort: 3012
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: vaultwarden-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: shared
              mountPath: /shared
      volumes:
        - name: vaultwarden-data
          persistentVolumeClaim:
            claimName: vaultwarden-pvc
        - name: tmp
          emptyDir: {}
        - name: shared
          emptyDir: {}
        - name: discovery-script
          configMap:
            name: vaultwarden-hostname-discovery
            defaultMode: 0555
