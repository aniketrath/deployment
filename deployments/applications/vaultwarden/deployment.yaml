apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: applications
  labels:
    app: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      serviceAccountName: vaultwarden-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap
          image: curlimages/curl:latest
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            - name: INFISICAL_IDENTITY_ID
              value: "${infisical_identity_id}"
            - name: INFISICAL_PROJECT_ID
              value: "${infisical_project_id}"
            - name: INFISICAL_ENVIRONMENT
              value: "${infisical_environment}"
            - name: VAULT_ADMIN_TOKEN_SECRET_NAME
              value: "${vault_admin_token_secret_name}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: bootstrap-script
              mountPath: /scripts
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.33.2-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              export DOMAIN="https://$(cat /shared/domain)"
              export ADMIN_TOKEN="$(cat /shared/admin_token)"
              exec /start.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: SIGNUPS_ALLOWED
              value: "true"
            - name: DATA_FOLDER
              value: "/data"
          ports:
            - name: http
              containerPort: 80
            - name: websocket
              containerPort: 3012
          volumeMounts:
            - name: vaultwarden-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: shared
              mountPath: /shared
      volumes:
        - name: vaultwarden-data
          persistentVolumeClaim:
            claimName: vaultwarden-pvc
        - name: tmp
          emptyDir: {}
        - name: shared
          emptyDir: {}
        - name: bootstrap-script
          configMap:
            name: vaultwarden-bootstrap-script
            defaultMode: 0555
