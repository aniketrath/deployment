apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: n8n-static-secret
  namespace: applications
spec:
  infisicalAuthRef:
    name: n8n-infisical-auth
    namespace: applications
  syncOptions:
    refreshInterval: 1m
    instantUpdates: false
  sources:
    - projectId: "${n8n_infisical_project_id}"
      environmentSlug: "${n8n_infisical_environment}"
      secretPath: "${n8n_infisical_secret_path}"
  targets:
    - name: n8n-secrets
      namespace: applications
      kind: Secret
      creationPolicy: Owner
