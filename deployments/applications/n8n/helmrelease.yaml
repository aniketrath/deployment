apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: applications
spec:
  interval: 10m
  chart:
    spec:
      chart: n8n
      version: ">=1.0.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: n8n
        namespace: applications
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      tag: "1.110.1"

    secretRefs:
      existingSecret: n8n-secrets

    database:
      type: postgresdb
      host: postgres.infrastructure.svc.cluster.local
      port: 5432
      name: "n8n"
      user: "${POSTGRES_USER}"
      passwordSecret:
        name: clustercreds-postgres
        key: POSTGRES_PASSWORD

    redis:
      host: redis.infrastructure.svc.cluster.local
      port: 6379

    queueMode:
      workerReplicaCount: 1
      workerConcurrency: 10

    ingress:
      enabled: true
      className: tailscale
      hosts:
        - host: n8n
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - n8n
          secretName: n8n-tls-cert

    persistence:
      enabled: true
      size: 5Gi
