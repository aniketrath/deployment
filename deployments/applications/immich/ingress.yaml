apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: applications
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - immich
      secretName: immich-tls-cert
  rules:
    - host: immich
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  name: http
