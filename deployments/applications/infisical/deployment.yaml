apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical
  namespace: applications
  labels:
    app: infisical
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infisical
  template:
    metadata:
      labels:
        app: infisical
    spec:
      serviceAccountName: infisical-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: hostname-discovery
          image: curlimages/curl:latest
          command: ["/bin/sh", "/scripts/discover.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: discovery-script
              mountPath: /scripts
      containers:
        - name: infisical
          image: infisical/infisical:latest-postgres
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              export SITE_URL="https://$(cat /shared/domain)"
              exec docker-entrypoint.sh ./standalone-entrypoint.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          envFrom:
            - secretRef:
                name: clustercreds-infisical
          env:
            - name: PORT
              value: "80"
            - name: DB_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: clustercreds-infisical
                  key: DB_CONNECTION_URI
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: clustercreds-infisical
                  key: REDIS_URL
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ssl-certs
              mountPath: /etc/ssl/certs
            - name: shared
              mountPath: /shared
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ssl-certs
          emptyDir: {}
        - name: shared
          emptyDir: {}
        - name: discovery-script
          configMap:
            name: infisical-hostname-discovery
            defaultMode: 0555
