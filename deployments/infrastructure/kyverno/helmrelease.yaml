apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: infrastructure
spec:
  interval: 10m
  targetNamespace: kyverno
  chart:
    spec:
      chart: kyverno
      version: "3.9.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: infrastructure
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      install: true
