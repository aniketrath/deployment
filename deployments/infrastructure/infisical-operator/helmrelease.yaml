apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical-secrets-operator
  namespace: infrastructure
spec:
  interval: 10m
  chart:
    spec:
      chart: secrets-operator
      version: ">=0.11.0 <0.12.0"
      sourceRef:
        kind: HelmRepository
        name: infisical
        namespace: infrastructure
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    installCRDs: true
