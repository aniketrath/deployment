apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      targetRevision: 0.44.0
      chart: headlamp
      helm:
        releaseName: headlamp
        valueFiles:
          - $values/deployments/infrastructure/headlamp/values.yaml
    - repoURL: https://gitlab.com/stackcraft/deployment.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: infrastructure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
