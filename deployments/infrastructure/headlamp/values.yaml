config:
  # Base path if hosted behind a subpath (leave empty for root domain)
  baseURL: ""
  # Enable automatic plugin reload when the plugin config changes
  watchPlugins: true
serviceAccount:
  create: false
  name: headlamp-admin
clusterRoleBinding:
  create: true
  clusterRoleName: view
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi
podLabels:
  chaos-monkey/target: "true"
  chaos-monkey/action: "delete"
replicaCount: 2
pluginsManager:
  enabled: true
  baseImage: node:lts-alpine
  version: latest
  configContent: |
    plugins:
      - name: cert-manager
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
        version: 0.1.0
      - name: kubescape
        source: https://artifacthub.io/packages/headlamp/kubescape-headlamp-plugin/headlamp_kubescape
        version: 0.11.2
      - name: kyverno
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_kyverno
        version: 0.1.0
      - name: kube-vip
        source: https://artifacthub.io/packages/headlamp/headlamp-kube-vip/headlamp-kube-vip
        version: 1.0.2
      - name: metallb
        source: https://artifacthub.io/packages/headlamp/headlamp-metallb-plugin/headlamp-metallb-plugin
        version: 0.5.1
    installOptions:
      parallel: true
      maxConcurrent: 2
initContainers:
  - name: headlamp-prometheus-plugin
    image: alpine:3.22
    imagePullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        wget -O /tmp/prometheus-plugin.tar.gz https://github.com/headlamp-k8s/plugins/releases/download/prometheus-0.9.1/prometheus-0.9.1.tar.gz
        echo "06afabe42da69e8e0c5c2632acc3fee020566825d2ae71ff8e4f3dd7f78fc4ae  /tmp/prometheus-plugin.tar.gz" | sha256sum -c -
        tar -xzf /tmp/prometheus-plugin.tar.gz -C /headlamp-plugins-shared
    securityContext:
      runAsNonRoot: false
      privileged: false
      runAsUser: 0
      runAsGroup: 0
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
      - name: plugins-dir
        mountPath: /headlamp-plugins-shared
  - name: headlamp-flux-plugin
    image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:latest
    imagePullPolicy: Always
    command:
      - /bin/sh
      - -c
      - cp -r /plugins/* /headlamp-plugins-shared/
    securityContext:
      runAsNonRoot: false
      privileged: false
      runAsUser: 0
      runAsGroup: 0
    volumeMounts:
      - name: plugins-dir
        mountPath: /headlamp-plugins-shared
