apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingress.yaml
  - rbac.yaml

patches:
  - target:
      kind: Ingress
      name: headlamp-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: headlamp.chimera-fence.ts.net
      - op: replace
        path: /spec/tls/0/hosts/0
        value: headlamp.chimera-fence.ts.net
