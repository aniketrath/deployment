apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingress.yaml
  - rbac.yaml
  - helmrepository.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: headlamp-values
    namespace: flux-system
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
