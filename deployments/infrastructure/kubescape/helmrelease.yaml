apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
  namespace: infrastructure
spec:
  interval: 10m
  targetNamespace: kubescape
  chart:
    spec:
      chart: kubescape-operator
      version: "1.41.0"
      sourceRef:
        kind: HelmRepository
        name: kubescape
        namespace: infrastructure
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    clusterName: ${CLUSTER_NAME}
    certificates:
      strategy: initContainer
    capabilities:
      configurationScan: enable
      continuousScan: enable
      vulnerabilityScan: enable
      nodeScan: disable
      networkEventsStreaming: disable
      runtimeObservability: disable
      runtimeDetection: disable
      malwareDetection: disable
      nodeProfileService: disable
      networkPolicyService: disable
      admissionController: disable
      httpDetection: disable
      seccompProfileService: disable
