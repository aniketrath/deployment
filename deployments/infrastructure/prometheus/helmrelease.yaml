apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: infrastructure
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus
      version: "29.40.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: infrastructure
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    alertmanager:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kube-state-metrics:
      enabled: true
    prometheus-node-exporter:
      enabled: true
    server:
      global:
        scrape_interval: 30s
      retention: 7d
      retentionSize: 2GB
      persistentVolume:
        enabled: true
        size: 4Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
