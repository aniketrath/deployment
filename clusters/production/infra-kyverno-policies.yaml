apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-kyverno-policies
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-kyverno
  interval: 10m
  path: ./deployments/infrastructure/kyverno/policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
