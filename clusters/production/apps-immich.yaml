apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-immich
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-postgres
    - name: infra-redis
    - name: tailscale-operator
  interval: 10m
  path: ./deployments/applications/immich
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: applications
  wait: true
  timeout: 20m
  postBuild:
    substitute:
      immich_storage_size: 60Gi
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: immich-db-init
      namespace: applications
    - apiVersion: apps/v1
      kind: Deployment
      name: immich-server
      namespace: applications
    - apiVersion: apps/v1
      kind: Deployment
      name: immich-machine-learning
      namespace: applications
