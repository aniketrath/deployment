apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-n8n
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-postgres
    - name: apps-infisical
    - name: infra-infisical-operator
    - name: tailscale-operator
  interval: 10m
  path: ./deployments/applications/n8n
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: applications
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: Secret
        name: clustercreds-postgres
    substitute:
      n8n_infisical_identity_id: "1c56ab0f-6af0-49e0-af46-d22d3cc3b7c4"
      n8n_infisical_project_id: "f785167c-2037-4317-a7d3-51b9e5739609"
      n8n_infisical_environment: "production"
      n8n_infisical_secret_path: "/"
      n8n_tailscale_hostname: "n8n"
      n8n_webhook_host: "https://n8n.chimera-fence.ts.net"
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: n8n
      namespace: applications
    - apiVersion: batch/v1
      kind: Job
      name: n8n-db-init
      namespace: applications
