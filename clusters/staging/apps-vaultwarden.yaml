apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-vaultwarden
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-postgres
    - name: infra-redis
    - name: apps-infisical
    - name: infra-infisical-operator
    - name: tailscale-operator
  interval: 10m
  path: ./deployments/applications/vaultwarden
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: applications
  wait: true
  timeout: 5m
  postBuild:
    substitute:
      infisical_identity_id: "bb87b166-71c7-4111-af03-d0ef0f83016f"
      infisical_project_id: "5f6f8914-872b-46bb-b0c1-1ce5352c8b6f"
      infisical_environment: "staging"
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: vaultwarden
      namespace: applications