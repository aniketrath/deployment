apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-infisical
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-postgres
    - name: infra-redis
    - name: tailscale-operator
  interval: 10m
  path: ./deployments/applications/infisical
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: applications
  wait: true
  timeout: 3m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: infisical
      namespace: applications
    - apiVersion: batch/v1
      kind: Job
      name: infisical-db-init
      namespace: applications
