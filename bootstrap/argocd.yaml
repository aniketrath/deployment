apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: deployments
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://gitlab.com/stackcraft/deployment.git
      revision: main
      directories:
      - path: applications/*
      - path: applications/headlamp
        exclude: true
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://gitlab.com/stackcraft/deployment.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: applications
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
