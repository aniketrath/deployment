apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: deployments
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://gitlab.com/stackcraft/deployment.git
        revision: version/v2
        directories:
          - path: deployments/*/*
          - path: deployments/tailscale
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://gitlab.com/stackcraft/deployment.git
        targetRevision: version/v2
        path: '{{path}}'
        directory:
          recurse: false
          exclude: 'kustomization.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path[1]}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
