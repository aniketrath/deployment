apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../applications/headlamp
  - ../../applications/vaultwarden
  - ../../applications/infisical

patches:
  # 1. Headlamp Ingress Patch
  - target:
      kind: Ingress
      name: headlamp-ingress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: headlamp-ingress
      spec:
        rules:
          - host: headlamp.chimera-fence.ts.net
        tls:
          - hosts:
              - headlamp.chimera-fence.ts.net

  # 2. Vaultwarden Ingress Patch
  - target:
      kind: Ingress
      name: vaultwarden
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: vaultwarden
      spec:
        rules:
          - host: vault.chimera-fence.ts.net
        tls:
          - hosts:
              - vault.chimera-fence.ts.net

  # 3. Vaultwarden Deployment Env Patch (DOMAIN)
  - target:
      kind: Deployment
      name: vaultwarden
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vaultwarden
      spec:
        template:
          spec:
            containers:
              - name: vaultwarden
                env:
                  - name: DOMAIN
                    value: "https://vault.chimera-fence.ts.net"

  # 4. Infisical Ingress Patch
  - target:
      kind: Ingress
      name: infisical
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: infisical
      spec:
        rules:
          - host: infisical.chimera-fence.ts.net
        tls:
          - hosts:
              - infisical.chimera-fence.ts.net

  # 5. Infisical Deployment Env Patch (SITE_URL)
  - target:
      kind: Deployment
      name: infisical
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: infisical
      spec:
        template:
          spec:
            containers:
              - name: infisical
                env:
                  - name: SITE_URL
                    value: "https://infisical.chimera-fence.ts.net"