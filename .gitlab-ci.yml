stages:
  - lint
  - validate
  - security

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_STAGE: security

.app_change_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - deployments/**/*
        - namespaces/**/*
        - clusters/**/*
        - scripts/**/*
        - Makefile
        - .gitlab-ci.yml
        - kind-config.yaml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ------------------------------------------------------------------------------
# 1. YAML Syntax & Makefile Linting
# ------------------------------------------------------------------------------
lint:syntax:
  extends: .app_change_rules
  stage: lint
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache make
    - pip install --no-cache-dir yamllint
  script:
    - echo "==> Checking YAML syntax..."
    - yamllint deployments/ namespaces/ clusters/
    - echo "==> Dry-running Makefile targets..."
    - make -n help

# ------------------------------------------------------------------------------
# 2. Kubernetes and Flux Schema Validation
# ------------------------------------------------------------------------------
validate:k8s-schemas:
  extends: .app_change_rules
  stage: validate
  image:
    name: ghcr.io/yannh/kubeconform:v0.6.7-alpine
    entrypoint: [""]
  script:
    - echo "==> Validating Kubernetes and Flux manifests against schemas..."
    - >-
      find deployments/ namespaces/ clusters/ -type f
      \( -name "*.yaml" -o -name "*.yml" \)
      ! -name "*values*" ! -iname "Chart.yaml"
      ! -iname "kustomization.yaml" ! -name "gotk-components.yaml"
      -print0 | xargs -0 /kubeconform -summary -strict
      -cache .cache/kubeconform
      -schema-location default
      -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

validate:flux:
  extends: .app_change_rules
  stage: validate
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache kubectl py3-yaml
  script:
    - echo "==> Validating Flux kustomize builds and dependency graph..."
    - |
      found=0
      for kfile in $(find deployments/ -name kustomization.yaml); do
        dir=$(dirname "$kfile")
        echo "--> $dir"
        kubectl kustomize "$dir" > /dev/null
        found=$((found + 1))
      done
      echo "    ($found kustomization path(s) built OK)"
    - python3 scripts/validate-flux-deps.py

# ------------------------------------------------------------------------------
# 3. Dynamic Helm Values Validation
# ------------------------------------------------------------------------------
validate:helm-charts:
  extends: .app_change_rules
  stage: validate
  image:
    name: alpine/helm:3.14.0
    entrypoint: [""]
  script:
    - echo "==> Auto-discovering and validating Helm applications..."
    - |
      helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/ --force-update
      helm repo update

      for dir in deployments/infrastructure/*; do
        if [ -d "$dir" ] && [ -f "$dir/values.yaml" ]; then
          app=$(basename "$dir")
          echo "--> Validating Helm release config for: $app"
          case "$app" in
            headlamp)
              helm template "$app" headlamp/headlamp -f "$dir/values.yaml" > /dev/null
              ;;
            *)
              echo "    (No external chart mapping defined for $app, skipping helm template)"
              ;;
          esac
        fi
      done

# ------------------------------------------------------------------------------
# 4. Security & Misconfiguration Scanning
# ------------------------------------------------------------------------------
security:trivy-scan:
  extends: .app_change_rules
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo "==> Scanning manifests for security risks..."
    - trivy config --severity HIGH,CRITICAL .
