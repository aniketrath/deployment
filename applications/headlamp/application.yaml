apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.44.0
      helm:
        valueFiles:
          - $values/applications/headlamp/values.yaml
    - repoURL: https://gitlab.com/stackcraft/deployment.git
      targetRevision: main
      ref: values
    - repoURL: https://gitlab.com/stackcraft/deployment.git
      targetRevision: main
      path: applications/headlamp
      directory:
        include: "{rbac.yaml,ingress.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: infrastructure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
