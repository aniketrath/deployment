apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: applications
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - vault.chimera-fence.ts.net
      secretName: vault-tls-cert
  rules:
    - host: vault.chimera-fence.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  name: http
