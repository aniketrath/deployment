apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infisical
  namespace: applications
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - infisical.chimera-fence.ts.net
      secretName: infisical-tls-cert
  rules:
    - host: infisical.chimera-fence.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infisical
                port:
                  name: http
